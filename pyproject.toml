[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-query-structure"
version = "0.2.1"
description = "Topic-map match + bounded LLM query expansion for hybrid search; never retrieves or answers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grounded Query Structure contributors" }]
keywords = ["semantic-search", "query-understanding", "retrieval", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "grounded-stopwords>=0.1.0",
]

[project.optional-dependencies]
openai = ["httpx>=0.27,<1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
grounded-query-structure = "grounded_query_structure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
